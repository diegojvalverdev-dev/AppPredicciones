<nav class="qe-nav">
  <div class="qe-nav__inner">

    <!-- Logo -->
    <a routerLink="/inicio" class="qe-logo" (click)="closeMenu()">
      <div class="qe-logo__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
      </div>
      <div class="qe-logo__text">
        <span>ECLIPGOL</span>
        <small>PRONÓSTICOS</small>
      </div>
    </a>

    <!-- Desktop links -->
    <div class="qe-nav__links">
      <a routerLink="/inicio"      routerLinkActive="qe-nav__link--active" class="qe-nav__link">Inicio</a>
      <a routerLink="/pronosticar" routerLinkActive="qe-nav__link--active" class="qe-nav__link">Pronosticar</a>
      <a routerLink="/final4"      routerLinkActive="qe-nav__link--active" class="qe-nav__link">Final 4</a>
      <a routerLink="/partidos"    routerLinkActive="qe-nav__link--active" class="qe-nav__link">Partidos</a>
      <a routerLink="/posiciones"  routerLinkActive="qe-nav__link--active" class="qe-nav__link">Ranking</a>
      <a routerLink="/historial"   routerLinkActive="qe-nav__link--active" class="qe-nav__link">Historial</a>
      <a routerLink="/grupos"      routerLinkActive="qe-nav__link--active" class="qe-nav__link">Crear grupo</a>
    </div>

    <!-- Right: badge usuario (clic → /admin) + logout + hamburger -->
    <div class="qe-nav__right">

      <!-- Badge usuario — navega a /admin al hacer clic -->
      <a routerLink="/admin" class="qe-user-badge" style="text-decoration:none;cursor:pointer;"
         title="Panel de administración">
        <div class="qe-user-badge__dot"></div>
        <span>{{ displayName }}</span>
      </a>

      <!-- Logout -->
      <button (click)="logout()" class="qe-logout" title="Cerrar sesión"
        style="background:none;border:none;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>

      <!-- Hamburger mobile -->
      <button class="qe-hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
        <span [class.open]="menuOpen"></span>
        <span [class.open]="menuOpen"></span>
        <span [class.open]="menuOpen"></span>
      </button>
    </div>

  </div>

  <!-- Mobile menu -->
  <div class="qe-mobile-menu" [class.qe-mobile-menu--open]="menuOpen">
    <a routerLink="/inicio"      routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">🏠 Inicio</a>
    <a routerLink="/pronosticar" routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">🏆 Pronosticar</a>
    <a routerLink="/final4"      routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">🔒 Final 4</a>
    <a routerLink="/partidos"    routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">⚽ Partidos</a>
    <a routerLink="/posiciones"  routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">📊 Posiciones</a>
    <a routerLink="/historial"   routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">📜 Historial</a>
    <a routerLink="/grupos"      routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">👥 Crear grupo</a>
    <a routerLink="/admin"       routerLinkActive="qe-mobile-link--active" class="qe-mobile-link" (click)="closeMenu()">🛡️ Admin</a>
    <button (click)="logout()" class="qe-mobile-link"
      style="background:none;border:none;text-align:left;width:100%;color:var(--muted);cursor:pointer;font-size:15px;font-weight:500;padding:14px 20px;border-bottom:1px solid var(--border);">
      ↩ Cerrar sesión
    </button>
  </div>
</nav>
