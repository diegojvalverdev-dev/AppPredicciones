<app-navbar></app-navbar>
<app-alert></app-alert>

<div class="page">

  <!-- Header: título + selector de grupo + guardar todos -->
  <div class="flex-between mb-md" style="flex-wrap:wrap;gap:10px;">
    <div>
      <h1 class="title-page mb-0">PRONOSTICAR</h1>
      <p class="subtitle">{{ totalCompletos }} / {{ partidos.length }} completados</p>
    </div>

    <div class="flex-row gap-sm" style="flex-wrap:wrap;align-items:center;">
      <!-- Selector de grupo del usuario -->
      <div class="inp-group" style="width:clamp(140px,30vw,200px);">
        <select class="inp inp--select" style="font-size:12px;"
          [value]="grupoActivo?.gru_id"
          (change)="onCambiarGrupo($any($event.target).value)">
          <option *ngIf="cargandoGrupos" value="">Cargando...</option>
          <option *ngFor="let g of gruposUsuario" [value]="g.gru_id">{{ g.gru_nombre }}</option>
        </select>
        <span class="inp-group__icon">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </div>
      <button (click)="guardarTodos()" class="btn-green btn-green--sm">Guardar todos</button>
    </div>
  </div>

  <!-- Barra de progreso -->
  <div class="progress-track mb-lg">
    <div class="progress-fill"
      [style.width]="partidos.length ? (totalCompletos/partidos.length*100)+'%' : '0%'"></div>
  </div>

  <!-- Toggle vista + selector de grupos de partido -->
  <div class="flex-between mb-lg" style="flex-wrap:wrap;gap:10px;">
    <!-- Toggle Por grupos / Por fechas -->
    <div class="tab-toggle">
      <button class="tab-toggle__btn" [class.tab-toggle__btn--active]="vista==='grupos'"
        (click)="cambiarVista('grupos')">📋 Por grupos</button>
      <button class="tab-toggle__btn" [class.tab-toggle__btn--active]="vista==='fechas'"
        (click)="cambiarVista('fechas')">📅 Por fechas</button>
    </div>

    <!-- Grupos de partidos (Grupo A, Grupo B...) — solo en vista grupos -->
    <div *ngIf="vista==='grupos' && gruposPartidos.length"
      class="flex-row gap-sm" style="flex-wrap:wrap;">
      <button *ngFor="let g of gruposPartidos" (click)="cambiarGrupoPartido(g)"
        class="btn-dark btn-dark--sm"
        [style.borderColor]="grupoPartidoActivo===g?'var(--primary)':''"
        [style.color]="grupoPartidoActivo===g?'var(--primary)':''">
        {{ g }}
      </button>
    </div>
  </div>

  <!-- ── VISTA GRUPOS ── -->
  <ng-container *ngIf="vista==='grupos'">
    <div class="flex-col gap-md">
      <ng-container *ngFor="let p of partidosPorGrupo">
        <ng-container *ngTemplateOutlet="tarjetaPartido; context:{ $implicit: p }"></ng-container>
      </ng-container>
      <div *ngIf="gruposPartidos.length===0" class="card" style="padding:32px;text-align:center;">
        <p class="subtitle mb-0">Sin partidos disponibles para este grupo.</p>
      </div>
    </div>
  </ng-container>

  <!-- ── VISTA FECHAS ── -->
  <ng-container *ngIf="vista==='fechas'">
    <div class="card mb-lg" style="padding:16px;">
      <div class="filter-grid mb-sm">
        <div>
          <label class="label-section mb-sm" style="display:block;">DESDE</label>
          <input type="date" [(ngModel)]="fechaDesde" class="inp" />
        </div>
        <div>
          <label class="label-section mb-sm" style="display:block;">HASTA</label>
          <input type="date" [(ngModel)]="fechaHasta" class="inp" />
        </div>
      </div>
      <button (click)="aplicarFechas()" class="btn-green" style="width:100%;padding:10px;font-size:13px;">
        Buscar
      </button>
    </div>

    <p *ngIf="partidosPorFecha.length===0" class="text-muted mb-lg">
      Sin partidos en este rango de fechas.
    </p>

    <div *ngFor="let gf of partidosPorFecha" class="mb-xl">
      <p class="fecha-label">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
        </svg>
        {{ gf.label }}
      </p>
      <div class="flex-col gap-md">
        <ng-container *ngFor="let p of gf.items">
          <ng-container *ngTemplateOutlet="tarjetaPartido; context:{ $implicit: p }"></ng-container>
        </ng-container>
      </div>
    </div>
  </ng-container>
</div>

<!-- ── TEMPLATE TARJETA PARTIDO ── -->
<ng-template #tarjetaPartido let-p>
  <div class="card partido-card" [class.partido-card--selected]="p.pronostico">
    <div class="partido-meta">
      <div class="partido-meta__left">
        <span class="text-muted" style="font-size:11px;">{{ p.fecha }} · {{ p.hora }}</span>
        <span class="badge-green" style="font-size:10px;">{{ p.grupoPartido }}</span>
        <span *ngIf="p.pronosticoGuardado" class="badge-muted" style="font-size:10px;color:#4ade80;">✅</span>
      </div>
      <span class="text-muted" style="font-size:11px;">{{ p.torneo }}</span>
    </div>
    <div class="partido-teams mb-sm">
      <span class="partido-teams__name partido-teams__name--right">{{ p.local }}</span>
      <div class="partido-score">
        <input type="number" [(ngModel)]="p.golesLocal" min="0" max="20"
          class="partido-score__inp" placeholder="0" />
        <span class="partido-score__sep">-</span>
        <input type="number" [(ngModel)]="p.golesVisitante" min="0" max="20"
          class="partido-score__inp" placeholder="0" />
      </div>
      <span class="partido-teams__name">{{ p.visitante }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="partido-btns" style="flex:1;">
        <button class="partido-btn" [class.partido-btn--active]="p.pronostico==='local'"
          (click)="seleccionar(p,'local')">{{ p.local.substring(0,3).toUpperCase() }}</button>
        <button class="partido-btn" [class.partido-btn--active]="p.pronostico==='empate'"
          (click)="seleccionar(p,'empate')">X</button>
        <button class="partido-btn" [class.partido-btn--active]="p.pronostico==='visitante'"
          (click)="seleccionar(p,'visitante')">{{ p.visitante.substring(0,3).toUpperCase() }}</button>
      </div>
      <button (click)="guardarPronostico(p)" class="btn-green btn-green--sm"
        [disabled]="p.guardando" style="flex-shrink:0;padding:8px 14px;">
        {{ p.guardando ? '...' : p.pronosticoGuardado ? 'Modificar' : 'Guardar' }}
      </button>
    </div>
  </div>
</ng-template>
