<div class="page-centered">
  <div class="qe-logo-wrap">
    <div class="qe-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    </div>
    <div class="qe-logo-text">
      <span>QUINIELA<span class="qe-logo-ec">EC</span></span>
      <small>PRONÓSTICOS</small>
    </div>
  </div>

  <!-- Token inválido -->
  <div *ngIf="!tokenValido" class="card page-centered__card" style="text-align:center;padding:32px;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f87171"
      stroke-width="2" style="display:block;margin:0 auto 16px;">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8"  x2="12"   y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p style="font-size:16px;font-weight:700;color:#fff;margin:0 0 8px;">
      Enlace inválido o expirado
    </p>
    <p class="subtitle mb-lg">Los parámetros del enlace no son válidos.</p>
    <a routerLink="/forgot-password" class="btn-green" style="text-decoration:none;padding:10px 24px;">
      Solicitar nuevo OTP
    </a>
  </div>

  <!-- Éxito -->
  <div *ngIf="exitoso" class="card page-centered__card" style="text-align:center;padding:32px;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4ade80"
      stroke-width="2" style="display:block;margin:0 auto 16px;">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <p style="font-size:16px;font-weight:700;color:#fff;margin:0 0 8px;">
      ¡Contraseña actualizada!
    </p>
    <p class="subtitle">Redirigiendo al inicio de sesión...</p>
  </div>

  <!-- Modal cambio de contraseña -->
  <ng-container *ngIf="tokenValido && !exitoso">
    <div *ngIf="modalCambioContrasena"
      style="position:fixed;inset:0;background:rgba(0,0,0,.65);
             display:flex;align-items:center;justify-content:center;
             z-index:9999;padding:20px;">
      <div style="background:#112614;border:1px solid rgba(74,222,128,.4);
                  border-radius:20px;padding:32px 28px;max-width:380px;
                  width:100%;text-align:center;">

        <!-- Ícono -->
        <div style="width:64px;height:64px;border-radius:50%;
                    background:rgba(74,222,128,.15);
                    display:flex;align-items:center;justify-content:center;
                    margin:0 auto 20px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
            stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>

        <p style="font-size:18px;font-weight:900;color:#fff;margin:0 0 24px;">
          Nueva contraseña
        </p>

        <!-- Formulario dentro del modal con [formGroup] -->
        <form [formGroup]="form" (ngSubmit)="resetearPassword()" class="flex-col gap-md"
          style="text-align:left;">

          <!-- Nuevo password -->
          <div>
            <label class="label-section mb-sm" style="display:block;">
              NUEVO PASSWORD
            </label>
            <input type="password" formControlName="nuevoPassword"
              class="inp" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
            <p *ngIf="form.get('nuevoPassword')?.invalid && form.get('nuevoPassword')?.touched"
              class="text-danger mt-sm" style="font-size:12px;">
              Mínimo 6 caracteres.
            </p>
          </div>

          <!-- Repetir password -->
          <div>
            <label class="label-section mb-sm" style="display:block;">
              REPETIR PASSWORD
            </label>
            <input type="password" formControlName="repetirPassword"
              class="inp" placeholder="Repite tu contraseña" autocomplete="new-password" />
            <p *ngIf="form.errors?.['noCoinciden'] && form.get('repetirPassword')?.touched"
              class="text-danger mt-sm" style="font-size:12px;">
              Las contraseñas no coinciden.
            </p>
          </div>

          <!-- Error del servidor -->
          <div *ngIf="error" class="alert-danger">{{ error }}</div>

          <!-- Botón guardar -->
          <button type="submit" class="btn-green btn-green--full"
            style="margin-top:8px;" [disabled]="loading">
            {{ loading ? 'Guardando...' : 'GUARDAR CONTRASEÑA' }}
          </button>

        </form>
      </div>
    </div>
  </ng-container>

</div>
